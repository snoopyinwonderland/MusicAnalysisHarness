[project]
name = "musicanote-harness"
version = "0.1.0"
description = "Evidence-first MusicXML analysis and arrangement planning prototype"
requires-python = ">=3.11"
dependencies = ["music21>=10.5,<11", "jsonschema>=4.26,<5", "verovio>=6.3,<7"]

[project.scripts]
musicanote = "musicanote_harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
